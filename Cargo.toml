[package]
name = "magnet_island"
version = "0.1.9"
edition = "2024"
description = "小游戏中心 — 离线儿童小游戏合集"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "magnet-island"
path = "src/main.rs"

[dependencies]
bevy = { version = "=0.16.1", default-features = false, features = ["bevy_asset", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_pbr", "bevy_render", "bevy_text", "bevy_ui", "bevy_window", "bevy_winit", "multi_threaded", "png", "webp", "wav", "default_font", "android-native-activity", "android_shared_stdcxx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
debug = 0
strip = true

[package.metadata.android]
package = "com.aigames.magnetisland"
apk_name = "magnet-island"
assets = "assets"
build_targets = ["aarch64-linux-android"]

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "小游戏中心"
theme = "@android:style/Theme.Material.Light.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
# Start in landscape; runtime switches only SkyRaid to portrait.
orientation = "landscape"
launch_mode = "singleTask"
